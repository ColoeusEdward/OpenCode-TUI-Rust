[package]
name = "opencode-tui-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native Rust terminal client for an OpenCode server"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tui-textarea = { version = "0.7.0", default-features = false, features = ["crossterm"] }
unicode-segmentation = "1.13"
unicode-width = "0.2.0"
url = "2.5"
